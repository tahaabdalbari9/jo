
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  .page {
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    min-height: 600px;
    position: relative;
    overflow: hidden;
    background: #0a1628;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .stars-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%,100%{opacity:0.2;transform:scale(1);}
    50%{opacity:1;transform:scale(1.4);}
  }
  .flag-stripe {
    position: absolute;
    left: 0; right: 0;
    opacity: 0.06;
  }
  .flag-stripe.black { top: 0; height: 33.33%; background: #000; }
  .flag-stripe.white { top: 33.33%; height: 33.33%; background: #fff; }
  .flag-stripe.green { top: 66.66%; height: 33.33%; background: #007a3d; }
  .flag-tri {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 300px 0 300px 140px;
    border-color: transparent transparent transparent rgba(206,17,38,0.12);
  }
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: pulse-orb 6s ease-in-out infinite;
  }
  .orb1 { width:320px; height:320px; background:rgba(0,122,61,0.18); top:-80px; right:-80px; }
  .orb2 { width:260px; height:260px; background:rgba(206,17,38,0.14); bottom:-60px; left:-60px; animation-delay: 3s; }
  .orb3 { width:200px; height:200px; background:rgba(255,255,255,0.05); top:40%; left:50%; transform:translateX(-50%); animation-delay:1.5s; }
  @keyframes pulse-orb { 0%,100%{opacity:0.6;transform:scale(1);} 50%{opacity:1;transform:scale(1.1);} }
  .card {
    position: relative;
    z-index:10;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    max-width: 580px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(20px);
    animation: card-in 1s ease both;
  }
  @keyframes card-in { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(206,17,38,0.2);
    border: 1px solid rgba(206,17,38,0.4);
    color: #ff8fa0;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 99px;
    margin-bottom: 1.5rem;
    animation: badge-in 1s 0.2s ease both;
  }
  @keyframes badge-in { from{opacity:0;transform:scale(0.85);} to{opacity:1;transform:scale(1);} }
  .badge-dot { width:6px; height:6px; background:#ff6b7a; border-radius:50%; animation:blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
  .jordan-star {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.2rem;
    animation: spin-slow 20s linear infinite;
  }
  @keyframes spin-slow { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .title {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 900;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 0.5rem;
    animation: fade-up 1s 0.3s ease both;
  }
  @keyframes fade-up { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  .title span.red { color: #ff6b7a; }
  .title span.green { color: #4ede9a; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1rem 0;
    animation: fade-up 1s 0.5s ease both;
  }
  .divider-line { flex:1; height:1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); }
  .divider-star { color: #ffd700; font-size: 18px; }
  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    margin-bottom: 1rem;
    animation: fade-up 1s 0.6s ease both;
  }
  .body-text {
    font-size: 1rem;
    line-height: 1.9;
    color: rgba(255,255,255,0.6);
    margin-bottom: 1.5rem;
    animation: fade-up 1s 0.7s ease both;
  }
  .strips {
    display: flex;
    height: 5px;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    animation: fade-up 1s 0.8s ease both;
  }
  .strips div { flex:1; }
  .strip-black { background:#111; }
  .strip-white { background:#fff; }
  .strip-green { background:#007a3d; }
  .strip-red { background:#ce1126; }
  .cta-btn {
    display: inline-block;
    background: linear-gradient(135deg, #007a3d, #00a352);
    color: #fff;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 99px;
    border: none;
    cursor: pointer;
    animation: fade-up 1s 0.9s ease both;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(0,122,61,0.4);
  }
  .cta-btn:hover { transform:translateY(-2px); box-shadow: 0 8px 28px rgba(0,122,61,0.55); }
  .year-chip {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(206,17,38,0.85);
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 12px;
    border-radius: 99px;
    letter-spacing: 1px;
  }
</style>

<div class="page">
  <div class="stars-bg" id="stars"></div>
  <div class="flag-stripe black"></div>
  <div class="flag-stripe white"></div>
  <div class="flag-stripe green"></div>
  <div class="flag-tri"></div>
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>
  <div class="glow-orb orb3"></div>

  <div class="card">
    <div class="year-chip">٢٠٢٦</div>

    <div class="badge">
      <div class="badge-dot"></div>
      يوم الاستقلال الأردني
    </div>

    <svg class="jordan-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,2 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.3"/>
      <polygon points="50,10 59,33 84,33 64,48 72,72 50,57 28,72 36,48 16,33 41,33" fill="#ce1126"/>
      <circle cx="50" cy="44" r="10" fill="#fff" opacity="0.9"/>
      <polygon points="50,38 52,43 58,43 53,46 55,52 50,48 45,52 47,46 42,43 48,43" fill="#ce1126"/>
    </svg>

    <h1 class="title">
      عيد <span class="red">استقلال</span><br>
      <span class="green">أردني</span> سعيد
    </h1>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-star">★</span>
      <div class="divider-line"></div>
    </div>

    <p class="subtitle">كل عام والوطن بألف خير</p>

    <p class="body-text">
      إجلالاً واحتفاءً بيوم الوحدة والاستقلال،<br>
      نتمنى لك وللوطن دوام العزة والرفعة.
    </p>

    <div class="strips">
      <div class="strip-black"></div>
      <div class="strip-white"></div>
      <div class="strip-green"></div>
      <div class="strip-red"></div>
    </div>

    <button class="cta-btn" onclick="sendPrompt('أضف تأثيرات احتفالية أكثر للموقع مثل ألعاب نارية أو confetti')">
      🎆 اجعله أكثر احتفالاً
    </button>
  </div>
</div>

<script>
const starsEl = document.getElementById('stars');
for(let i=0; i<60; i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random()*2.5+1;
  s.style.cssText = `
    width:${size}px; height:${size}px;
    top:${Math.random()*100}%;
    left:${Math.random()*100}%;
    animation-delay:${Math.random()*4}s;
    animation-duration:${2+Math.random()*3}s;
  `;
  starsEl.appendChild(s);
}
</script>
